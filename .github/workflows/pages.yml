name: Pages

# 只在手动触发时运行：Pages 站点需要仓库所有者在 Settings → Pages 启用一次，
# 默认的 GITHUB_TOKEN 没有创建站点的权限（会报 Resource not accessible by integration）。
# 启用方式二选一：
#   1) 零配置：Settings → Pages → Source 选 "Deploy from a branch"，分支 main、目录 /docs。
#      这种方式不需要本工作流。
#   2) Actions：Settings → Pages → Source 选 "GitHub Actions"，然后在 Actions 页面手动运行本工作流。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
