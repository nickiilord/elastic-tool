name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 首次使用需要仓库所有者在 Settings → Pages 把 Source 设为 GitHub Actions。
      # GitHub 不允许默认 GITHUB_TOKEN 创建 Pages site（configure-pages 会报 404），
      # enablement 只在 token 足够权限时生效，普通公开仓库请直接手动启用一次。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
